{% extends "base.html" %}
{% block title %} User Authentication {% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/authen.css') }}">
{% endblock %}
{% block content %} 



<div class="auth-wrapper">
    <div class="auth-container">

        <div class="tab-switch">
            <div id="login-tab" class="tab active">Log In</div>
            <div id="signup-tab" class="tab">Sign Up</div>
        </div>


        <div id="signup-form" class="form-box">
            <form action="/signup" method="POST">
                <input type="text" name="username" placeholder="Username" required />
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Password" required />
                <button type="submit">Sign Up</button>
            </form>
        </div>


        <div id="login-form" class="form-box hidden">
            <form action="/login" method="POST">
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Password" required />
                <button type="submit">Log</button>
            </form>
        </div>
        {% if current_user.is_authenticated %}
            <div class="logout-section">
                <form action="{{ url_for('main.logout') }}" method="GET">
                    <button type="submit" class="logout-button">Logout</button>
                </form>
            </div>
        {% endif %}
    </div>
</div>


{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/authen.js') }}"></script>
{% endblock %}
