{% extends "base.html" %}
{% block title %} Entry page {% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/entry.css') }}">
{% endblock %}

{% block extra_nav %}
<div class="navbar-section navbar-left">
    <div class="welcome">
        <div class="avatar"></div>
        <span>Welcome Back, <a href="#">{{ current_user.username }}</a></span>
    </div>
</div>
<div class="navbar-section navbar-right">
    <a href="{{ url_for('main.dashboard_page') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">Overview</a>
    <a href="{{ url_for('main.entry_page') }}" class="{% if active_page == 'entry' %}active{% endif %}">Entry</a>
</div>

{% endblock %}


{% block content %}
<div class="entry">
    <div class="income">
        <h3>Income</h3>
    </div>
    <div class="savings">
        <h3>Savings</h3>
    </div>
    <div class="goals">
        <h3>Goals</h3>
    </div>
    <div class="investments">
        <h3>Investments</h3>
    </div>
    <div class="expense">
        <h3>Expense</h3>
    </div>
    <div class="bills">
        <h3>Bills</h3>
    </div>
    <div class="debt">
        <h3>Debt</h3>
    </div>
</div>
{% endblock %}
